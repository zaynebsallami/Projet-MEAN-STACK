<div class="dashboard-container">
    <div class="dashboard-header">
      <h1>Dashboard</h1>
      
      <div class="dashboard-actions">
        <button class="btn btn-light">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
        
        <div class="dropdown">
          <button class="btn btn-light dropdown-toggle">
            <i class="fas fa-download"></i> Export
          </button>
          <div class="dropdown-menu">
            <button class="dropdown-item">CSV</button>
            <button class="dropdown-item">Excel</button>
            <button class="dropdown-item">PDF</button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon users-icon">
          <i class="fas fa-users"></i>
        </div>
        <div class="stat-content">
          <div class="stat-label">Total Users</div>
          <div class="stat-value">1254</div>
          <div class="stat-change positive">
            <i class="fas fa-arrow-up"></i> +12.5%
          </div>
        </div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon products-icon">
          <i class="fas fa-box"></i>
        </div>
        <div class="stat-content">
          <div class="stat-label">Total Products</div>
          <div class="stat-value">867</div>
          <div class="stat-change positive">
            <i class="fas fa-arrow-up"></i> +8.2%
          </div>
        </div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon orders-icon">
          <i class="fas fa-shopping-cart"></i>
        </div>
        <div class="stat-content">
          <div class="stat-label">Total Orders</div>
          <div class="stat-value">432</div>
          <div class="stat-change positive">
            <i class="fas fa-arrow-up"></i> +15.7%
          </div>
        </div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon revenue-icon">
          <i class="fas fa-dollar-sign"></i>
        </div>
        <div class="stat-content">
          <div class="stat-label">Total Revenue</div>
          <div class="stat-value">87654.32</div>
          <div class="stat-change positive">
            <i class="fas fa-arrow-up"></i> +10.3%
          </div>
        </div>
      </div>
    </div>
    
    <!-- Autres sections du tableau de bord peuvent être ajoutées ici -->
  </div>
